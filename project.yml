name: Yomu
options:
  bundleIdPrefix: com.yomu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  YomuCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Yomu:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: YomuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yomu.reader
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/YomuMac.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yomu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  YomuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/YomuUITests]
    dependencies:
      - target: Yomu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yomu.reader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yomu
        SWIFT_VERSION: "6.0"
        SUPPORTS_MACCATALYST: YES
schemes:
  Yomu:
    build:
      targets:
        Yomu: all
    run:
      config: Debug
    test:
      targets: [YomuUITests]
